[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "mongoose", "web-push"]

# Send /api/* requests to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Evening reminders: check every 15 minutes who needs a nudge
[functions."reminders"]
  schedule = "*/15 * * * *"
