<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Study Tracker</title>
  <meta name="theme-color" content="#0f1222" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236d5efc'/%3E%3Cpath d='M9 17l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Login -->
  <section id="login" class="login hidden">
    <form id="loginForm" class="login-card">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
      </div>
      <h1>Study Tracker</h1>
      <p class="muted">Small steps, every day.</p>
      <input id="passcode" type="password" placeholder="Passcode" autocomplete="current-password" required />
      <button type="submit" class="btn-primary">Unlock</button>
      <p id="loginError" class="error"></p>
    </form>
  </section>

  <!-- App -->
  <main id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <span class="logo small"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></span>
        <span class="brand-text">Study Tracker<span id="userName" class="user-name"></span></span>
      </div>
      <button id="logoutBtn" class="icon-btn" title="Log out" aria-label="Log out">
        <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4" /></svg>
      </button>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab is-active" data-view="today" role="tab">Today</button>
      <button class="tab" data-view="library" role="tab">Library</button>
      <button class="tab" data-view="books" role="tab">Books</button>
    </div>

    <div id="todayView" class="view">
    <nav class="date-nav">
      <button id="prevDay" class="icon-btn" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg></button>
      <div class="date-label">
        <div id="dayName" class="day-name"></div>
        <div id="dayDate" class="muted small"></div>
      </div>
      <button id="nextDay" class="icon-btn" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
      <button id="todayBtn" class="pill hidden">Today</button>
    </nav>

    <section class="card hero">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#8b7bff" />
              <stop offset="100%" stop-color="#2dd4bf" />
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="60" cy="60" r="50" />
          <circle id="ringBar" class="ring-bar" cx="60" cy="60" r="50" />
        </svg>
        <div class="ring-text">
          <span id="percent">0</span><small>%</small>
        </div>
      </div>
      <div class="hero-info">
        <div id="doneText" class="done-text"></div>
        <div id="cheer" class="muted"></div>
        <div class="streak">
          <svg viewBox="0 0 24 24"><path d="M12 2.5c.8 3.6 5 5.6 5 10.5a5 5 0 0 1-10 0c0-2 1-3.6 2.2-4.6.1 2 1 3.1 2.1 3.1 0-3-1.3-5.7.7-9z" /></svg>
          <span id="streak">0</span>&nbsp;day streak
        </div>
      </div>
    </section>

    <label class="card outing">
      <div>
        <div class="outing-title">Going out today</div>
        <div class="muted small">Core knowledge becomes optional</div>
      </div>
      <input id="outingToggle" type="checkbox" class="switch" />
    </label>

    <section>
      <h2 class="section-title">Today's tasks</h2>
      <ul id="taskList" class="task-list"></ul>
      <form id="addTaskForm" class="add-task">
        <input id="newTask" maxlength="80" placeholder="Add a task for this day…" />
        <button class="icon-btn add" aria-label="Add task"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></button>
      </form>
    </section>

    <section class="card note">
      <h2 class="section-title">Today I learned</h2>
      <textarea id="note" rows="3" maxlength="2000" placeholder="Explain one thing in 2–3 lines, as if to a junior…"></textarea>
    </section>

    <section class="card">
      <h2 class="section-title">This week</h2>
      <div id="week" class="week"></div>
    </section>

    <section class="card">
      <div class="row-between">
        <h2 class="section-title">Last 12 weeks</h2>
        <div class="legend muted small">less <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> more</div>
      </div>
      <div id="heatmap" class="heatmap"></div>
    </section>

    </div>

    <div id="libraryView" class="view hidden">
      <div class="chip-scroller">
        <button class="chip-arrow left" aria-label="Scroll left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg></button>
        <div id="trackChips" class="chips"></div>
        <button class="chip-arrow right" aria-label="Scroll right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
      </div>
      <section class="card lib-head">
        <div class="row-between">
          <div>
            <div id="libTitle" class="lib-title"></div>
            <div id="libCount" class="muted small"></div>
          </div>
          <div id="libPercent" class="lib-percent"></div>
        </div>
        <div class="progress"><i id="libBar"></i></div>
        <div class="lib-filters">
          <input id="libSearch" type="search" placeholder="Search…" />
          <select id="libLevel"></select>
          <select id="libStatus">
            <option value="all">All</option>
            <option value="todo">Not learned</option>
            <option value="done">Learned</option>
          </select>
        </div>
      </section>
      <div id="libList" class="lib-list"></div>
      <button id="libMore" class="more-btn hidden">Show more</button>
    </div>

    <div id="booksView" class="view hidden">
      <section class="card books-hero">
        <div>
          <div class="lib-title">My bookshelf</div>
          <div id="bkSummary" class="muted small"></div>
        </div>
        <div class="books-stats">
          <div class="stat s-reading"><b id="bkReading">0</b><span>reading</span></div>
          <div class="stat s-done"><b id="bkDone">0</b><span>read</span></div>
          <div class="stat s-todo"><b id="bkTodo">0</b><span>to read</span></div>
        </div>
      </section>

      <div class="chip-scroller">
        <button class="chip-arrow left" aria-label="Scroll left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg></button>
        <div id="genreChips" class="chips"></div>
        <button class="chip-arrow right" aria-label="Scroll right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
      </div>
      <div id="bookShelf" class="shelf"></div>

      <section class="card">
        <h2 class="section-title">Add a book</h2>
        <form id="addBookForm" class="book-form">
          <input id="bkTitle" placeholder="Title" maxlength="120" required />
          <input id="bkAuthor" placeholder="Author (optional)" maxlength="80" />
          <input id="bkWhy" class="span-2" placeholder="Why read it? (optional)" maxlength="200" />
          <select id="bkGenre" required></select>
          <button class="btn-primary" type="submit">Add book</button>
        </form>
        <h2 class="section-title" style="margin-top: 20px">Add a genre</h2>
        <form id="addGenreForm" class="add-task">
          <input id="genreName" placeholder="e.g. Fiction, Biographies, Finance…" maxlength="40" />
          <button class="icon-btn add" aria-label="Add genre"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></button>
        </form>
      </section>
    </div>

    <footer class="muted small footer">Consistency beats intensity.</footer>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
